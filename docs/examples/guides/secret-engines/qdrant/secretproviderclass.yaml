apiVersion: secrets-store.csi.x-k8s.io/v1alpha1
kind: SecretProviderClass
metadata:
  name: vault-db-provider
  namespace: demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.demo:8200"
    roleName: "k8s.-.demo.qdrant-app-role"
    objects: |
      - objectName: "qdrant-jwt-token"
        secretPath: "your-database-path/creds/k8s.-.demo.qdrant-app-role"
        secretKey: "jwt_token"
